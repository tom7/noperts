name = "noperts"
defaultTargets = ["Noperts", "SeptopertClassic", "SeptopertM18", "Minimality", "ProofOfMainTheorem",
  "DeltoidalHexecontahedron", "PentagonalHexecontahedron", "SnubDodecahedron", "SnubCube", "Nopert231",
  "constructSeptopertClassic", "checkSeptopertClassicCap", "constructSeptopertM18", "checkSeptopertM18Cap", "checkSeptopertM18Arc", "checkSeptopertM12Arc", "checkSeptopertM12Axis", "checkSeptopertM12PCap", "constructSeptopertM12", "checkSeptopertArc", "checkSeptopertAxis", "checkSeptopertPCap", "constructSeptopert", "constructDeltoidalHexecontahedron",
  "constructPentagonalHexecontahedron", "constructSnubDodecahedron", "constructSnubCube",
  "checkSnubCubeCap", "constructNopert231",
  "Tests"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.style.multiGoal = true
weak.linter.style.cdot = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "Noperts"
roots = []
globs = [
  "Basic",
  "Bounding",
  "Cayley",
  "ConvertPose",
  "EuclideanSpaceNotation",
  "Global",
  "MainTheorem",
  "MatrixPose",
  "Nopert",
  "ParallelBool",
  "PointSym",
  "Pose",
  "PoseClasses",
  "PoseInterval",
  "PoseParam",
  "RealMod",
  "Util",
  "Atlas.+",
  "BalancedSupport.+",
  "Bounding.+",
  "Checker.+",
  "Global.+",
  "Pipeline.+",
  "RationalApprox.+",
  "Rupert.+",
]

[[lean_lib]]
name = "SeptopertClassic"
globs = ["SeptopertClassic", "SeptopertClassic.+"]

[[lean_lib]]
name = "SeptopertM18"
globs = ["SeptopertM18", "SeptopertM18.+"]

[[lean_lib]]
name = "Minimality"
