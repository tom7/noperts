name = "noperts"
defaultTargets = ["Noperthedron", "Septopert", "SmallRupert", "constructSeptopert", "checkSeptopertCap"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.style.multiGoal = true
weak.linter.style.cdot = true

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "tryAtEachStep"
git = "https://github.com/dwrensha/tryAtEachStep"
rev = "lean-v4.32.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.32.0"

[[lean_lib]]
name = "Noperthedron"
roots = []
globs = ["Noperthedron.+"]

[[lean_lib]]
name = "Septopert"
globs = ["Septopert.+"]

[[lean_lib]]
name = "SmallRupert"

[[lean_exe]]
name = "checkSeptopertCap"
root = "checkSeptopertCap"
buildType = "release"

[[lean_exe]]
name = "constructSeptopert"
root = "constructSeptopert"
buildType = "release"
