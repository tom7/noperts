name = "noperts"
defaultTargets = ["Noperts", "Septopert", "Minimality", "ProofOfMainTheorem",
  "DeltoidalHexecontahedron", "PentagonalHexecontahedron", "SnubDodecahedron", "Nopert231",
  "constructSeptopert", "checkSeptopertCap", "constructDeltoidalHexecontahedron",
  "constructPentagonalHexecontahedron", "constructSnubDodecahedron", "constructNopert231",
  "Tests"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.style.multiGoal = true
weak.linter.style.cdot = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "Noperts"
roots = []
globs = [
  "Basic",
  "Bounding",
  "Cayley",
  "ConvertPose",
  "EuclideanSpaceNotation",
  "Global",
  "MainTheorem",
  "MatrixPose",
  "Nopert",
  "ParallelBool",
  "PointSym",
  "Pose",
  "PoseClasses",
  "PoseInterval",
  "PoseParam",
  "RealMod",
  "Util",
  "Atlas.+",
  "BalancedSupport.+",
  "Bounding.+",
  "Checker.+",
  "Global.+",
  "Pipeline.+",
  "RationalApprox.+",
  "Rupert.+",
]

[[lean_lib]]
name = "Septopert"
globs = ["Septopert", "Septopert.+"]

[[lean_lib]]
name = "Minimality"
globs = ["Minimality", "Minimality.+"]

[[lean_lib]]
name = "ProofOfMainTheorem"
globs = ["ProofOfMainTheorem"]

[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

[[lean_lib]]
name = "DeltoidalHexecontahedron"
globs = ["DeltoidalHexecontahedron", "DeltoidalHexecontahedron.+"]

[[lean_lib]]
name = "PentagonalHexecontahedron"
globs = ["PentagonalHexecontahedron", "PentagonalHexecontahedron.+"]

[[lean_lib]]
name = "SnubDodecahedron"
globs = ["SnubDodecahedron", "SnubDodecahedron.+"]

[[lean_lib]]
name = "Nopert231"
globs = ["Nopert231", "Nopert231.+"]

[[lean_exe]]
name = "checkSeptopertCap"
root = "checkSeptopertCap"
buildType = "release"

[[lean_exe]]
name = "constructSeptopert"
root = "constructSeptopert"
buildType = "release"

[[lean_exe]]
name = "constructDeltoidalHexecontahedron"
root = "constructDeltoidalHexecontahedron"
buildType = "release"

[[lean_exe]]
name = "constructPentagonalHexecontahedron"
root = "constructPentagonalHexecontahedron"
buildType = "release"

[[lean_exe]]
name = "constructSnubDodecahedron"
root = "constructSnubDodecahedron"
buildType = "release"

[[lean_exe]]
name = "constructNopert231"
root = "constructNopert231"
buildType = "release"
