name = "noperts"
defaultTargets = ["Noperts", "Septopert", "Minimality", "constructSeptopert", "checkSeptopertCap"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.style.multiGoal = true
weak.linter.style.cdot = true

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "tryAtEachStep"
git = "https://github.com/dwrensha/tryAtEachStep"
rev = "lean-v4.32.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.32.0"

[[lean_lib]]
name = "Noperts"
roots = []
globs = [
  "Basic",
  "Bounding",
  "Cayley",
  "ConvertPose",
  "EuclideanSpaceNotation",
  "Global",
  "MainTheorem",
  "MatrixPose",
  "Nopert",
  "ParallelBool",
  "PointSym",
  "Pose",
  "PoseClasses",
  "PoseInterval",
  "PoseParam",
  "RealMod",
  "Util",
  "Atlas.+",
  "BalancedSupport.+",
  "Bounding.+",
  "Checker.+",
  "Global.+",
  "Pipeline.+",
  "RationalApprox.+",
  "Rupert.+",
]

[[lean_lib]]
name = "Septopert"
globs = ["Septopert", "Septopert.+"]

[[lean_lib]]
name = "Minimality"
globs = ["Minimality", "Minimality.+"]

[[lean_exe]]
name = "checkSeptopertCap"
root = "checkSeptopertCap"
buildType = "release"

[[lean_exe]]
name = "constructSeptopert"
root = "constructSeptopert"
buildType = "release"
